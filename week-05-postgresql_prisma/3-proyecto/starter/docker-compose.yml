services:
  postgres:
    image: postgres:16-alpine
    container_name: parque-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: parque_user
      POSTGRES_PASSWORD: parque_pass
      POSTGRES_DB: parque_atracciones
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: