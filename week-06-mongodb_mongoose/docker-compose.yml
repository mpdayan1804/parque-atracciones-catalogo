services:
  mongo:
    image: mongo:7
    container_name: parque-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: parque_user
      MONGO_INITDB_ROOT_PASSWORD: parque_pass
    volumes:
      - parque_mongo_data:/data/db

volumes:
  parque_mongo_data: